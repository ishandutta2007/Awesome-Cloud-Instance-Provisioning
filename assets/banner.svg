<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.6; }
    }
    @keyframes driftPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes driftPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes pulseLine {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.4; }
      50% { stroke-dashoffset: 40; opacity: 0.9; }
    }
    .orb-glow1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-glow2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 240px;
    }
    .pill-1 { animation: driftPill1 6s ease-in-out infinite; }
    .pill-2 { animation: driftPill2 5.5s ease-in-out infinite 1s; }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: pulseLine 6s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Background Glow Elements (Deep Behind Foreground) -->
  <circle class="orb-glow1" cx="220" cy="110" r="160" fill="#38bdf8" filter="url(#glow)" opacity="0.18" />
  <circle class="orb-glow2" cx="980" cy="240" r="180" fill="#a855f7" filter="url(#glow)" opacity="0.18" />

  <!-- Animated Data Connection Lines (Background) -->
  <path class="flow-line" d="M 120 290 Q 300 240 500 280 T 900 270 T 1120 210" fill="none" stroke="#38bdf8" stroke-width="1.8" />
  <path class="flow-line" d="M 80 80 Q 380 140 680 70 T 1100 120" fill="none" stroke="#c084fc" stroke-width="1.5" />

  <!-- Floating Dynamic Tech Badges in Background (Kept away from center text) -->
  <g class="pill-1" transform="translate(70, 45)">
    <rect width="145" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" opacity="0.85" />
    <circle cx="20" cy="16" r="4.5" fill="#38bdf8" />
    <text x="35" y="21" fill="#94a3b8" class="tag-text">cloud-init</text>
  </g>

  <g class="pill-2" transform="translate(1005, 55)">
    <rect width="135" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" opacity="0.85" />
    <circle cx="18" cy="16" r="4.5" fill="#818cf8" />
    <text x="32" y="21" fill="#94a3b8" class="tag-text">Terraform</text>
  </g>

  <g class="pill-2" transform="translate(85, 275)">
    <rect width="130" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" opacity="0.85" />
    <circle cx="18" cy="16" r="4.5" fill="#c084fc" />
    <text x="32" y="21" fill="#94a3b8" class="tag-text">Ansible</text>
  </g>

  <g class="pill-1" transform="translate(980, 265)">
    <rect width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" opacity="0.85" />
    <circle cx="18" cy="16" r="4.5" fill="#34d399" />
    <text x="32" y="21" fill="#94a3b8" class="tag-text">OpenTofu</text>
  </g>

  <!-- FOREGROUND: Main Title and Subtitle (Unobscured) -->
  <g id="foreground-content">
    <!-- Category Pill -->
    <rect x="440" y="52" width="320" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="456" cy="67" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="470" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em">CURATED DEVOPS &amp; IAC ECOSYSTEM</text>

    <!-- Main Heading -->
    <text x="600" y="152" text-anchor="middle" fill="url(#primaryGrad)" font-size="46" class="title-text">
      Cloud Instance Provisioning
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" text-anchor="middle" fill="#f8fafc" font-size="20" class="subtitle-text">
      Automated Bootstrapping, Infrastructure as Code &amp; Config Management
    </text>

    <!-- Detailed Secondary Description -->
    <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
      Comparing SaaS Platforms &amp; Open-Source Tools • Star Counts • Pricing &amp; Market Dynamics
    </text>

    <!-- Bottom Feature Badges Bar -->
    <g transform="translate(370, 275)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="70" y="18" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">⚡ Bootstrapping</text>

      <rect x="160" y="0" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="230" y="18" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="600">🏗️ IaC Automation</text>

      <rect x="320" y="0" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="390" y="18" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600">⚙️ Config Mgmt</text>
    </g>
  </g>
</svg>
